<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>Oficina</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'><rect width='16' height='16' fill='%232b2d42'/><rect x='3' y='3' width='10' height='7' fill='%233ddc84'/><rect x='7' y='10' width='2' height='2' fill='%23f1faee'/><rect x='4' y='12' width='8' height='1' fill='%23f1faee'/></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section class="login" id="login">
    <form class="login-card" id="login-form" autocomplete="off">
      <canvas class="pixel login-sprite" id="login-sprite" width="56" height="44" aria-hidden="true"></canvas>
      <h1>Oficina virtual</h1>
      <p class="sub">Acceso privado</p>
      <label for="pass">Contraseña</label>
      <input id="pass" type="password" autocomplete="current-password" required autofocus>
      <button type="submit" id="login-btn">Entrar</button>
      <p class="error" id="login-error" role="alert" hidden></p>
      <p class="hint">Los datos están cifrados: solo se pueden leer con la contraseña.</p>
    </form>
  </section>

  <div id="app" hidden>
    <header class="hud">
      <a href="#oficina" class="brand">▣ OFICINA</a>
      <div class="clocks" id="clocks"></div>
      <div class="hud-right">
        <span class="chip" id="modo"></span>
        <span class="updated" id="updated"></span>
        <button type="button" class="btn ghost" id="logout" title="Salir">Salir</button>
      </div>
    </header>
    <main id="view"></main>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button type="button" class="btn ghost modal-close" id="modal-close" aria-label="Cerrar">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="sprites.js"></script>
  <script src="app.js"></script>
</body>
</html>
